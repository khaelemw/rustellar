[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# Path for building in the workspace, version for crates.io. Keep the version
# equal to workspace.package.version.
[workspace.dependencies]
rustellar-bls = { path = "crates/rustellar-bls", version = "0.0.0" }
rustellar-core = { path = "crates/rustellar-core", version = "0.0.0" }
rustellar-detrend = { path = "crates/rustellar-detrend", version = "0.0.0" }
rustellar-model = { path = "crates/rustellar-model", version = "0.0.0" }
rustellar-tls = { path = "crates/rustellar-tls", version = "0.0.0" }

# The search's tests run thousands of searches (injection-recovery against
# astropy and transitleastsquares), so its debug builds are optimised.
# Overflow checks and debug assertions stay on.
[profile.dev.package.rustellar-bls]
opt-level = 2
