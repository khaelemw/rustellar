name: ci
on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # Without the `cuda` feature no GPU code is built: cudarc is not in
      # the dependency tree of any tool, `full` included.
      - name: no GPU code without cuda
        run: |
          if cargo tree -p rustellar --features full -e normal -i cudarc 2>/dev/null; then
            echo "cudarc is built without the cuda feature"
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The umbrella crate's tools are behind features, off by default.
      - run: cargo test -p rustellar --all-features

  # The `cuda` feature where there is no GPU or CUDA library: every search
  # falls back to the CPU, never a panic.
  cuda-without-gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rustellar-bls --features cuda
        env:
          RUSTELLAR_EXPECT_NO_CUDA: "1"
      - run: cargo test -p rustellar-tls --features cuda --lib cuda
        env:
          RUSTELLAR_EXPECT_NO_CUDA: "1"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      # Every feature but `cuda`, which needs Rust 1.88 (msrv-cuda).
      - run: cargo check --workspace --lib
      - run: cargo check -p rustellar --lib --features full

  # The `cuda` features on their own minimum Rust.
  msrv-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rustellar-bls -p rustellar-tls --lib --features rustellar-bls/cuda,rustellar-tls/cuda
      - run: cargo check -p rustellar --lib --features bls,tls,cuda
