[package]
name = "rustellar-bls"
description = "Box least squares transit search (Kovacs, Zucker & Mazeh 2002) in pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["astronomy", "exoplanet", "transit", "periodogram"]
categories = ["science", "algorithms"]
# The published package holds the library and its unit tests, which need no
# files. The reference data, the integration tests that read it and the
# benchmarks stay in the source.
exclude = ["/tests/", "/benches/"]

[features]
# The search on an NVIDIA GPU where there is one (`Device`): needs the CUDA
# driver and NVRTC at run time, or searches on the CPU. Needs Rust 1.88 or
# later (cudarc's libloading); the crate without it builds on 1.85.
cuda = ["dep:cudarc"]

[dependencies]
rustellar-core.workspace = true
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-version-from-build-system", "fallback-latest"] }

[dev-dependencies]
rstest = "0.28.0"
rustellar-model.workspace = true
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "search"
harness = false
