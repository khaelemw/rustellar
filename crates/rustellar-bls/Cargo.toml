[package]
name = "rustellar-bls"
description = "Box least squares transit search (Kovacs, Zucker & Mazeh 2002) in pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["astronomy", "exoplanet", "transit", "periodogram"]
categories = ["science", "algorithms"]
# Reference data for the integration tests only, and those tests; users of the
# crate do not need them. The fast_* and wrap_cases files stay: the unit tests
# in src read them.
exclude = [
    "tests/reference/autoperiod_cases.csv",
    "tests/reference/autoperiod_grids.csv",
    "tests/reference/exact_cases.csv",
    "tests/reference/exact_points.csv",
    "tests/reference/example_3_points.csv",
    "tests/reference/in_transit.csv",
    "tests/reference/ofir_cases.csv",
    "tests/reference/ofir_grids.csv",
    "tests/reference/slow_power.csv",
    "tests/reference/survey_curves.csv",
    "tests/reference/survey_power.csv",
    "tests/autoperiod.rs",
    "tests/ofir.rs",
    "tests/box_fit.rs",
    "tests/exact.rs",
    "tests/search.rs",
    "tests/survey.rs",
]

[dependencies]
rustellar-core.workspace = true

[dev-dependencies]
rstest = "0.28.0"
