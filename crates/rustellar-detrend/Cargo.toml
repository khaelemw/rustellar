[package]
name = "rustellar-detrend"
description = "Detrending light curves in pure Rust: time-windowed robust estimators such as the biweight (Hippke et al. 2019), solved to full precision, and splines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["astronomy", "exoplanet", "detrending", "light-curve"]
categories = ["science", "algorithms"]
# The published package holds the library and its unit tests, which need no
# files. The reference data, the integration tests that read it and the
# benchmarks stay in the source.
exclude = ["/tests/", "/benches/"]

[dependencies]
rustellar-core.workspace = true

[dev-dependencies]
rustellar-bls.workspace = true
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "detrend"
harness = false
