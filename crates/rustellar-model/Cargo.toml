[package]
name = "rustellar-model"
description = "Analytic transit light-curve model (Mandel & Agol, quadratic limb darkening) in pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["astronomy", "exoplanet", "transit", "light-curve"]
categories = ["science", "algorithms"]
# Reference data for the tests only, and the tests that read it; users of the
# crate do not need them. exact_lines.csv stays, as the unit tests in src read
# it.
exclude = [
    "tests/reference/batman_points.csv",
    "tests/reference/batman_sets.csv",
    "tests/reference/exact_random.csv",
    "tests/reference/exposure_points.csv",
    "tests/reference/flux_points.csv",
    "tests/reference/flux_random.csv",
    "tests/reference/lightcurve_points.csv",
    "tests/reference/lightcurve_sets.csv",
    "tests/exact_reference.rs",
    "tests/reference.rs",
    "tests/flux_reference.rs",
    "tests/exposure_reference.rs",
    "tests/flux_random.rs",
    "tests/lightcurve_reference.rs",
]

[dependencies]
rustellar-core.workspace = true

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
rstest = "0.28.0"

[[bench]]
name = "transit"
harness = false
