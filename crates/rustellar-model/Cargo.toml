[package]
name = "rustellar-model"
description = "Analytic transit light-curve model (Mandel & Agol, quadratic limb darkening) in pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["astronomy", "exoplanet", "transit", "light-curve"]
categories = ["science", "algorithms"]
# The published package holds the library and its unit tests, which need no
# files. The reference data, the integration tests that read it and the
# benchmarks stay in the source.
exclude = ["/tests/", "/benches/"]

[dependencies]
rustellar-core.workspace = true

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
rstest = "0.28.0"

[[bench]]
name = "transit"
harness = false
