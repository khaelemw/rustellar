[package]
name = "rustellar"
description = "Exoplanet and astronomy time-series tools in pure Rust; enable the parts you need as features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["astronomy", "exoplanet", "transit", "light-curve"]
categories = ["science", "algorithms"]
# The published package holds the library and its unit tests. The
# integration tests stay in the source.
exclude = ["/tests/"]

# Each tool is its own crate, brought in by a feature of the same name, so a
# build compiles only what it uses. rustellar-core is always included.
[features]
default = []
full = ["bls", "detrend", "fit", "ls", "mcmc", "model", "tls", "vet"]
# With `vet`, each search also brings its conversion into a vet candidate.
bls = ["dep:rustellar-bls", "rustellar-vet?/bls"]
detrend = ["dep:rustellar-detrend"]
fit = ["dep:rustellar-fit"]
ls = ["dep:rustellar-ls"]
mcmc = ["dep:rustellar-mcmc"]
model = ["dep:rustellar-model"]
tls = ["dep:rustellar-tls", "rustellar-vet?/tls"]
vet = ["dep:rustellar-vet"]
# The searches on an NVIDIA GPU, for whichever of `bls` and `tls` is on: needs
# Rust 1.88 or later, and the CUDA driver and NVRTC at run time (without
# them the searches run on the CPU). Not in `full`, which builds on 1.85.
cuda = ["rustellar-bls?/cuda", "rustellar-tls?/cuda"]

[dependencies]
rustellar-bls = { workspace = true, optional = true }
rustellar-core.workspace = true
rustellar-detrend = { workspace = true, optional = true }
rustellar-fit = { workspace = true, optional = true }
rustellar-ls = { workspace = true, optional = true }
rustellar-mcmc = { workspace = true, optional = true }
rustellar-model = { workspace = true, optional = true }
rustellar-tls = { workspace = true, optional = true }
rustellar-vet = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
rustellar-bls.workspace = true
rustellar-core.workspace = true
rustellar-fit.workspace = true
rustellar-model.workspace = true
rustellar-ls.workspace = true
rustellar-mcmc.workspace = true
rustellar-vet.workspace = true
